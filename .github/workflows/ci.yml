name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  latency-profile:
    # Temporary controlled observations for the Linux-only failure. The checks job below
    # remains the acceptance gate, including its original workers, assertions and deadlines.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: node scripts/profile-ci-latency.mjs
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latency-profile-${{ github.sha }}
          path: ci-latency-report/
          if-no-files-found: error
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx astro check
      - run: npm run test:unit
      - run: npm run build
      - name: JS budget (<= 50 KB gz on non-demo pages)
        run: node scripts/js-budget.mjs
      - name: Never-publish scan (built-in rules; the private denylist runs locally)
        run: node scripts/scan-content.mjs
      - name: No page repeats an element id
        run: node scripts/dup-ids.mjs
      - name: Link check (internal and external)
        run: node scripts/link-check.mjs dist --external
      - name: Link check of the /next/ preview build (every internal link honours the base)
        run: SITE_BASE=/next/ npx astro build --outDir dist-next && node scripts/link-check.mjs dist-next --base /next/
      - run: npx playwright install --with-deps chromium webkit
      - name: Browser tests (Chromium and WebKit)
        run: npx playwright test
      - name: Lighthouse CI (>= 0.95 in every category)
        run: npx lhci autorun
      - name: Retain the checked site for review
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: website-preview-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
